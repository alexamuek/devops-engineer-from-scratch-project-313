name: Python tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ secrets.BASE_URL }}

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-python@v7
      with:
        python-version: '3.14' 

    - name: Restore cache 
      id: cache-restore
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cache/uv
          ~/.cache/pip
        key: ${{ runner.os }}-app 

    - name: Install dependencies
      run: make install
    
    - name: Run pytest tests
      run: make test
    
    - name: lint
      run: make lint
    
    - name: Save cache
      id: cache-save
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.cache/uv
          ~/.cache/pip
        key: ${{ steps.cache-restore.outputs.cache-primary-key }}